<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Village West Team</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F3F3F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VW Team">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png?i=2">
<link rel="apple-touch-icon" href="icons/icon-180.png?i=2">
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<div id="app" aria-live="polite"></div>
<nav id="tabbar" class="tabbar" hidden></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:sans-serif">This app needs JavaScript turned on.</p></noscript>
<script>
/* Loads the newest app files. version.json is never cached, so an update shows up the next time the app opens. */
(function () {
  var d = document, done = false, last = '';
  try { last = localStorage.getItem('vwp.v') || ''; } catch (e) {}
  function add(tag, attrs, parent, next) {
    var el = d.createElement(tag), fired = false;
    function go() { if (!fired) { fired = true; if (next) next(); } }
    for (var k in attrs) el[k] = attrs[k];
    el.onload = go; el.onerror = go;
    parent.appendChild(el);
    if (next) setTimeout(go, 4000);
  }
  function start(v) {
    if (done) return; done = true;
    try { localStorage.setItem('vwp.v', v); } catch (e) {}
    add('link', { rel: 'stylesheet', href: 'app.css?v=' + v }, d.head, function () {
      add('script', { src: 'icons.js?v=' + v }, d.body, function () { add('script', { src: 'app.js?v=' + v }, d.body); });
    });
  }
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) { start(String(j.v)); })
    .catch(function () { start(last || '12'); });
  setTimeout(function () { start(last || '12'); }, 2500);
})();
</script>
</body>
</html>
